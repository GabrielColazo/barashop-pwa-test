<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo-text" aria-label="BaraShop"><img src="assets/img/nuevologobarashop.webp" alt="BaraShop"></a>

      <div class="d-flex align-items-center gap-2" id="header-actions">

        <a href="index.html" class="btn-nav-box">
          <svg viewBox="0 0 60 44" xmlns="http://www.w3.org/2000/svg" style="width:18px;height:auto;"><path d="M8 30 Q30 38 52 30 L47 40 Q30 44 13 40 Z" fill="#C99461"/><path stroke="#7A5230" stroke-width="3" stroke-linecap="round" d="M30 26 L30 4"/><path d="M30 6 Q46 14 49 26 Q39 30 30 30 Z" fill="#3E8E4F"/><path d="M30 6 Q14 14 11 26 Q21 30 30 30 Z" fill="#2F6E3C"/></svg>

            👤 Mi cuenta

            <div style="padding:0.5rem 0.75rem;font-size:0.85rem;color:#6B7280;border-bottom:1px solid #E5E7EB;" id="detalle-dropdown-email"></div>
            <div style="padding:0.5rem 0.75rem;font-size:0.8rem;color:#9CA3AF;border-bottom:1px solid #E5E7EB;" id="detalle-dropdown-name" class="d-none"></div>
            <a href="mis-avisos.html" style="display:block;padding:0.5rem 0.75rem;font-size:0.9rem;color:#111827;text-decoration:none;border-radius:6px;">📋 Mis Avisos</a>
            <button onclick="cerrarSesion();toggleDetalleMenu()" style="width:100%;text-align:left;padding:0.5rem 0.75rem;border:none;background:none;font-size:0.9rem;color:#EF4444;cursor:pointer;border-radius:6px;">🚪 Cerrar sesión</button>

      <p class="footer-copy">Desarrollado por <a href="https://www.gaboweb.com.ar" target="_blank" rel="noopener" class="gaboweb-link"><span class="gw-orange">&lt;</span>GABO<span class="gw-orange">WEB/&gt;</span></a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/anuncios.js"></script>
  <script>
    function escapeHtml(str) {
      const d = document.createElement('div')
      d.textContent = str
      return d.innerHTML
    }

    function renderIcono(icono) {
      if (!icono) return '📦'
      if (icono.trim().startsWith('<svg')) return icono
      return escapeHtml(icono)
    }

    let imagenActual = 0
    let imagenes = []

    async function cargarAnuncio() {
      const params = new URLSearchParams(window.location.search)
      const id = params.get('id')
      if (!id) {
        document.getElementById('anuncio-detalle').innerHTML = '<p class="text-center py-5 text-secondary">Anuncio no encontrado</p>'
        return
      }

      try {
        const a = await obtenerAnuncio(id)
        document.getElementById('loading').classList.add('d-none')
        imagenes = a.imagenes || []

        // Actualizar SEO dinámico
        const tituloSEO = `${a.titulo} - BaraShop Baradero`
        const descSEO = a.descripcion
          ? (a.descripcion.length > 155 ? a.descripcion.slice(0, 152) + '...' : a.descripcion)
          : `Mirá "${a.titulo}" en BaraShop, el clasificado local de Baradero.`
        const imagenSEO = imagenes.length > 0 ? imagenes[0].url : 'https://barashop.com.ar/assets/img/nuevologobarashop.webp'
        const urlSEO = `https://barashop.com.ar/anuncio.html?id=${a.id}`

        document.title = tituloSEO
        document.querySelector('meta[name="description"]').setAttribute('content', descSEO)
        document.querySelector('link[rel="canonical"]').setAttribute('href', urlSEO)
        document.querySelector('meta[property="og:title"]').setAttribute('content', tituloSEO)
        document.querySelector('meta[property="og:description"]').setAttribute('content', descSEO)
        document.querySelector('meta[property="og:image"]').setAttribute('content', imagenSEO)
        document.querySelector('meta[property="og:url"]').setAttribute('content', urlSEO)
        document.querySelector('meta[name="twitter:title"]').setAttribute('content', tituloSEO)
        document.querySelector('meta[name="twitter:description"]').setAttribute('content', descSEO)
        document.querySelector('meta[name="twitter:image"]').setAttribute('content', imagenSEO)

        const sesion = await obtenerSesion()
        const esPropio = sesion.data.session && sesion.data.session.user.id === a.usuario_id

        let galeriaHtml = ''
        if (imagenes.length > 0) {
          galeriaHtml = `
            <div style="position:relative;">
              <img class="anuncio-imagen" id="img-principal" src="${imagenes[0].url}" alt="${escapeHtml(a.titulo)}" style="cursor:pointer;" onclick="abrirLightbox(0)">
              ${imagenes.length > 1 ? `
                <div class="d-flex gap-2 flex-wrap mb-3" id="galeria-thumbs">
                  ${imagenes.map((img, i) => `
                    <img class="gallery-thumb ${i === 0 ? 'active' : ''}" src="${img.url}" alt="${escapeHtml(a.titulo)} - foto ${i + 1}" onclick="cambiarImagen(${i})">
                  `).join('')}
                </div>
              ` : ''}
            </div>
          `
        } else {
          galeriaHtml = `<img class="anuncio-imagen" src="assets/img/no-image.svg" alt="${escapeHtml(a.titulo)}">`
        }

        document.getElementById('anuncio-detalle').innerHTML = `
          ${galeriaHtml}
          <div class="anuncio-header">
            <div>
              <h1>${escapeHtml(a.titulo)}</h1>
              <span class="badge-categoria mt-1">${renderIcono(a.categorias?.icono)} ${escapeHtml(a.categorias?.nombre || 'Sin categoría')}</span>
            </div>
            <div class="anuncio-precio">${a.precio === null || a.precio === undefined ? 'A convenir' : '$' + Number(a.precio).toLocaleString('es-AR')}</div>
          </div>
          <div class="anuncio-meta">
            <span>📅 ${new Date(a.created_at).toLocaleDateString('es-AR', { year: 'numeric', month: 'long', day: 'numeric' })}</span>
            ${a.nombre || a.apellido ? `<span style="font-size:0.85rem;color:#374151;">👤 Publicado por: ${escapeHtml([a.nombre, a.apellido].filter(Boolean).join(' '))}</span>` : ''}
            ${a.telefono ? `<a href="${armarLinkWhatsapp(a.telefono, a.titulo)}" target="_blank" rel="noopener noreferrer" title="Contactar por WhatsApp" class="btn-whatsapp">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="#25D366"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.36 5.07L2 22l5.07-1.33A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.62 0-3.14-.44-4.44-1.2l-.32-.19-3.3.87.88-3.22-.21-.33A7.94 7.94 0 0 1 4 12c0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8zm4.4-5.6c-.24-.12-1.43-.7-1.65-.79-.22-.08-.38-.12-.54.12-.16.24-.62.79-.76.95-.14.16-.28.18-.52.06-.24-.12-1.01-.37-1.92-1.18-.71-.63-1.19-1.42-1.33-1.66-.14-.24-.01-.37.11-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.19-.46-.39-.4-.54-.41-.14-.01-.3-.01-.46-.01-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.7 2.6 4.12 3.64.58.25 1.03.4 1.38.51.58.18 1.11.16 1.53.1.47-.07 1.43-.58 1.63-1.15.2-.57.2-1.05.14-1.15-.06-.1-.22-.16-.46-.28z"/></svg>
              <span>${escapeHtml(a.telefono)}</span>
            </a>` : ''}
          </div>
          ${(() => {
            const fechaBase = a.renovado_at || a.created_at
            const transcurridos = Math.floor((Date.now() - new Date(fechaBase)) / (1000*60*60*24))
            const restantes = 30 - transcurridos
            if (restantes > 2) return `<span style="display:inline-block;font-size:0.8rem;color:#6B7280;background:#F3F4F6;padding:0.2rem 0.6rem;border-radius:50px;font-weight:500;margin-top:0.5rem;">Vence en ${restantes} días</span>`
            if (restantes > 0) return `<span style="display:inline-block;font-size:0.8rem;color:#EA580C;background:#FFF7ED;padding:0.2rem 0.6rem;border-radius:50px;font-weight:500;margin-top:0.5rem;">⚠️ Vence en ${restantes} día(s)</span>`
            return `<span style="display:inline-block;font-size:0.8rem;color:#9CA3AF;background:#F3F4F6;padding:0.2rem 0.6rem;border-radius:50px;font-weight:500;margin-top:0.5rem;">Vencido</span>`
          })()}
          ${a.descripcion ? `<div class="anuncio-descripcion">${escapeHtml(a.descripcion)}</div>` : ''}
          <div class="mt-4 d-flex gap-2 flex-wrap">
            <a href="index.html" class="btn-outline-custom">← Volver</a>
            ${esPropio ? `<button class="btn-outline-custom" style="border-color:#EF4444;color:#EF4444;" onclick="eliminarAnuncioHandler('${a.id}')">🗑 Eliminar</button>` : ''}
          </div>
        `
      } catch (err) {
        document.getElementById('anuncio-detalle').innerHTML = `<p class="text-center py-5 text-secondary">Error al cargar el anuncio: ${escapeHtml(err.message)}</p>`
      }
    }

    function cambiarImagen(index) {
      imagenActual = index
      document.getElementById('img-principal').src = imagenes[index].url
      document.querySelectorAll('.gallery-thumb').forEach((el, i) => {
        el.classList.toggle('active', i === index)
      })
    }

    function abrirLightbox(index) {
      if (!imagenes.length) return
      window.open(imagenes[index].url, '_blank')
    }

    async function eliminarAnuncioHandler(id) {
      if (!confirm('¿Estás seguro de eliminar este anuncio?')) return
      try {
        await window.eliminarAnuncio(id)
        window.location.href = 'index.html'
      } catch (err) {
        alert(err.message)
      }
    }

    function toggleDetalleMenu() {
      document.getElementById('detalle-user-dropdown').classList.toggle('d-none')
    }

    document.addEventListener('click', (e) => {
      const dd = document.getElementById('detalle-user-dropdown')
      if (!e.target.closest('#detalle-user-menu')) dd.classList.add('d-none')
    })

    document.addEventListener('DOMContentLoaded', function () {
      function actualizarSesionHeader(session) {
        const buttons = document.getElementById('detalle-auth-buttons')
        const menu = document.getElementById('detalle-user-menu')
        const avatar = document.getElementById('detalle-user-avatar')
        const emailLabel = document.getElementById('detalle-dropdown-email')
        const nameLabel = document.getElementById('detalle-dropdown-name')
        const offcanvasIngresar = document.getElementById('offcanvas-detalle-ingresar')
        const offcanvasUserInfo = document.getElementById('offcanvas-detalle-user-info')
        const offcanvasAvatar = document.getElementById('offcanvas-detalle-avatar')
        const offcanvasEmail = document.getElementById('offcanvas-detalle-email')
        const offcanvasName = document.getElementById('offcanvas-detalle-name')

        if (session) {
          buttons.classList.add('d-none')
          menu.classList.remove('d-none')
          offcanvasIngresar.classList.add('d-none')
          offcanvasUserInfo.classList.remove('d-none')
          avatar.innerHTML = '<svg viewBox="0 0 60 44" xmlns="http://www.w3.org/2000/svg"><path d="M8 30 Q30 38 52 30 L47 40 Q30 44 13 40 Z" fill="#C99461"/><path stroke="#7A5230" stroke-width="3" stroke-linecap="round" d="M30 26 L30 4"/><path d="M30 6 Q46 14 49 26 Q39 30 30 30 Z" fill="#3E8E4F"/><path d="M30 6 Q14 14 11 26 Q21 30 30 30 Z" fill="#2F6E3C"/></svg>'
          const email = session.user.email
          avatar.title = email
          emailLabel.textContent = email
          offcanvasEmail.textContent = email
          const meta = session.user.user_metadata || {}
          const nombre = meta.nombre || meta.full_name || meta.name || ''
          if (nombre) {
            const nombreCompleto = [meta.nombre, meta.apellido].filter(Boolean).join(' ') || nombre
            nameLabel.textContent = nombreCompleto
            nameLabel.classList.remove('d-none')
            offcanvasName.textContent = nombreCompleto
            offcanvasName.classList.remove('d-none')
          } else {
            nameLabel.classList.add('d-none')
            offcanvasName.classList.add('d-none')
          }
        } else {
          buttons.classList.remove('d-none')
          menu.classList.add('d-none')
          offcanvasIngresar.classList.remove('d-none')
          offcanvasUserInfo.classList.add('d-none')
          avatar.innerHTML = '👤 Mi cuenta'
          nameLabel.classList.add('d-none')
          offcanvasName.classList.add('d-none')
        }
      }

      obtenerSesion().then(({ data: { session } }) => {
        actualizarSesionHeader(session)
      })

      escucharAuth((event, session) => {
        actualizarSesionHeader(session)
      })
    })

    cargarAnuncio()
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const btn = document.querySelector('.mobile-menu-toggle')
      const panel = document.getElementById('menuMobile')
      if (!btn || !panel) return
      panel.addEventListener('shown.bs.offcanvas', () => btn.classList.add('abierto'))
      panel.addEventListener('hidden.bs.offcanvas', () => btn.classList.remove('abierto'))
    })
  </script>
  <div class="offcanvas offcanvas-end" tabindex="-1" id="menuMobile" aria-labelledby="menuMobileLabel">
    <div class="offcanvas-header">
      <img src="assets/img/nuevologobarashop.webp" alt="BaraShop" style="height:32px;">
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column gap-2">
      <a href="publicar.html" class="btn-publicar">
        <span style="font-size:1.4rem;line-height:1;">+</span>
        Publicar
      </a>
      <a href="login.html" class="header-link" id="offcanvas-detalle-ingresar">
        <span style="font-size:1.4rem;line-height:1;">➜</span>
        Ingresar
      </a>
      <div id="offcanvas-detalle-user-info" class="d-none">
        <div class="d-flex align-items-center gap-2 py-2 px-1">
          <div class="avatar avatar-barco" id="offcanvas-detalle-avatar"><svg viewBox="0 0 60 44" xmlns="http://www.w3.org/2000/svg"><path d="M8 30 Q30 38 52 30 L47 40 Q30 44 13 40 Z" fill="#C99461"/><path stroke="#7A5230" stroke-width="3" stroke-linecap="round" d="M30 26 L30 4"/><path d="M30 6 Q46 14 49 26 Q39 30 30 30 Z" fill="#3E8E4F"/><path d="M30 6 Q14 14 11 26 Q21 30 30 30 Z" fill="#2F6E3C"/></svg></div>
          <span id="offcanvas-detalle-email" style="font-size:0.85rem;color:#6B7280;"></span>
          <span id="offcanvas-detalle-name" class="d-none" style="font-size:0.8rem;color:#9CA3AF;"></span>
        </div>
        <a href="mis-avisos.html" class="btn-secundario w-100 mb-2">
          <span style="font-size:1.4rem;line-height:1;">📋</span>
          Mis Avisos
        </a>
        <button onclick="cerrarSesion()" class="btn-secundario w-100" style="color:#EF4444;border-color:#EF4444;">
          <span style="font-size:1.4rem;line-height:1;">🚪</span>
          Cerrar sesión
        </button>
      </div>
      <a href="contacto.html" class="header-link">
        <span style="font-size:1.4rem;line-height:1;">✉️</span>
        Contacto
      </a>
    </div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registrado:', reg.scope))
          .catch(err => console.error('Error registrando SW:', err));
      });
    }
  </script>
</body>
