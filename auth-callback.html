<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirigiendo - BaraShop</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://*.supabase.co https://cdn.jsdelivr.net; img-src 'self' https: data: blob:; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co https://cdn.jsdelivr.net">
  <script>window.__rawHash = window.location.hash</script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FAFAFA;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #111827;
    }
    .card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 2.5rem;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      max-width: 360px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #D1FAE5;
      border-top-color: #059669;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 1.1rem; margin-bottom: 0.3rem; }
    p { font-size: 0.9rem; color: #6B7280; }
    a { color: #059669; font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Bienvenido a BaraShop</h2>
    <p>Te estamos redirigiendo...</p>
    <p id="fallback-link" style="margin-top:1rem;font-size:0.8rem;">
      Si no sos redirigido, <a href="/auth-callback.html">hacé click acá</a>
    </p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search)
      const error = params.get('error')

      if (error) {
        document.getElementById('fallback-link').style.display = 'none'
        document.querySelector('.spinner').style.display = 'none'
        document.querySelector('h2').textContent = 'No pudimos iniciar sesión'
        const errorDesc = params.get('error_description')
        document.querySelector('p').textContent = errorDesc ? decodeURIComponent(errorDesc) : 'Ocurrió un error inesperado.'
        document.querySelector('p').innerHTML += '<br><br><a href="login.html">Volver a intentar</a>'
        return
      }

      sb.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY') {
          window.location.href = 'login.html?mode=reset'
        } else if (event === 'SIGNED_IN' && session) {
          window.location.href = 'publicar.html'
        }
      })

      setTimeout(() => {
        window.location.href = 'login.html?mode=reset'
      }, 4000)
    })()
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registrado:', reg.scope))
          .catch(err => console.error('Error registrando SW:', err));
      });
    }
  </script>
</body>
</html>
