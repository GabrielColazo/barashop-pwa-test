  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/anuncios.js"></script>
  <script>
    function escapeHtml(str) {
      const d = document.createElement('div')
      d.textContent = str
      return d.innerHTML
    }

    function renderIcono(icono) {
      if (!icono) return '📦'
      if (icono.trim().startsWith('<svg')) return icono
      return escapeHtml(icono)
    }

    async function cargarMisAvisos() {
      const loading = document.getElementById('mis-avisos-loading')
      const container = document.getElementById('mis-avisos-container')

      try {
        const anuncios = await obtenerMisAnuncios()
        loading.classList.add('d-none')

        if (anuncios.length === 0) {
          container.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1">
              <div class="empty-icon">📭</div>
              <h3>Todavía no publicaste nada</h3>
              <p>Creá tu primer anuncio gratis</p>
              <a href="publicar.html" class="btn-primary-custom">Publicar anuncio</a>
            </div>
          `
          return
        }

        container.innerHTML = anuncios.map(a => {
          const imgUrl = a.imagenes?.[0]?.url || 'assets/img/no-image.svg'
          const icono = renderIcono(a.categorias?.icono)
          const nombreCategoria = escapeHtml(a.categorias?.nombre || '')
          const fecha = new Date(a.created_at).toLocaleDateString('es-AR')
          const fechaBase = a.renovado_at || a.created_at
          const diasRestantes = 30 - Math.floor((Date.now() - new Date(fechaBase)) / (1000*60*60*24))
          return `
          <div class="card-anuncio">
            <div class="card-img-wrap">
              <img class="card-img" src="${imgUrl}" alt="${escapeHtml(a.titulo)}" loading="lazy">
              <span class="badge-categoria">${icono} ${nombreCategoria}</span>
              <div class="card-precio-tag">${a.precio === null || a.precio === undefined ? 'A convenir' : '$' + Number(a.precio).toLocaleString('es-AR')}</div>
            </div>
            <div class="card-body">
              <div class="card-titulo">${escapeHtml(a.titulo)}</div>
              <div class="card-meta">
                <span class="card-fecha">${fecha} ${diasRestantes > 2 ? `· ${diasRestantes}d` : diasRestantes > 0 ? `⚠️ ${diasRestantes}d` : 'Vencido'}</span>
              </div>
            </div>
            <div class="card-acciones-mis-avisos">
              <a href="publicar.html?editar=${a.id}" class="btn-sm-edit" onclick="event.stopPropagation()">✏️ Editar</a>
              ${diasRestantes <= 2 ? `<button onclick="event.stopPropagation(); renovarAviso('${a.id}')" class="btn-sm-edit" style="color:#1D4ED8;border-color:#BFDBFE;">🔄 Renovar</button>` : ''}
              <button onclick="event.stopPropagation(); eliminarAviso('${a.id}')" class="btn-sm-delete">🗑 Eliminar</button>
            </div>
          </div>`
        }).join('')
      } catch (err) {
        loading.classList.add('d-none')
        container.innerHTML = `<p class="text-center text-secondary py-5">Error: ${escapeHtml(err.message)}</p>`
      }
    }

    async function eliminarAviso(id) {
      if (!confirm('¿Estás seguro de eliminar este anuncio?')) return
      try {
        await eliminarAnuncio(id)
        cargarMisAvisos()
      } catch (err) {
        alert(err.message)
      }
    }

    async function renovarAviso(id) {
      try {
        await actualizarAnuncio(id, { renovado_at: new Date().toISOString() })
        alert('Aviso renovado por 30 días más')
        cargarMisAvisos()
      } catch (err) {
        alert(err.message)
      }
    }

    function toggleMisMenu() {
      document.getElementById('mis-user-dropdown').classList.toggle('d-none')
    }

    document.addEventListener('click', (e) => {
      const dd = document.getElementById('mis-user-dropdown')
      if (!e.target.closest('#mis-user-menu')) dd.classList.add('d-none')
    })

    document.addEventListener('DOMContentLoaded', function () {
      function actualizarSesionHeader(session) {
        const buttons = document.getElementById('mis-auth-buttons')
        const menu = document.getElementById('mis-user-menu')
        const avatar = document.getElementById('mis-user-avatar')
        const emailLabel = document.getElementById('mis-dropdown-email')
        const nameLabel = document.getElementById('mis-dropdown-name')
        const offcanvasIngresar = document.getElementById('offcanvas-mis-ingresar')
        const offcanvasUserInfo = document.getElementById('offcanvas-mis-user-info')
        const offcanvasAvatar = document.getElementById('offcanvas-mis-avatar')
        const offcanvasEmail = document.getElementById('offcanvas-mis-email')
        const offcanvasName = document.getElementById('offcanvas-mis-name')

        if (session) {
          buttons.classList.add('d-none')
          menu.classList.remove('d-none')
          offcanvasIngresar.classList.add('d-none')
          offcanvasUserInfo.classList.remove('d-none')
          avatar.innerHTML = '<svg viewBox="0 0 60 44" xmlns="http://www.w3.org/2000/svg"><path d="M8 30 Q30 38 52 30 L47 40 Q30 44 13 40 Z" fill="#C99461"/><path stroke="#7A5230" stroke-width="3" stroke-linecap="round" d="M30 26 L30 4"/><path d="M30 6 Q46 14 49 26 Q39 30 30 30 Z" fill="#3E8E4F"/><path d="M30 6 Q14 14 11 26 Q21 30 30 30 Z" fill="#2F6E3C"/></svg>'
          const email = session.user.email
          avatar.title = email
          emailLabel.textContent = email
          offcanvasEmail.textContent = email
          const meta = session.user.user_metadata || {}
          const nombre = meta.nombre || meta.full_name || meta.name || ''
          if (nombre) {
            const nombreCompleto = [meta.nombre, meta.apellido].filter(Boolean).join(' ') || nombre
            nameLabel.textContent = nombreCompleto
            nameLabel.classList.remove('d-none')
            offcanvasName.textContent = nombreCompleto
            offcanvasName.classList.remove('d-none')
          } else {
            nameLabel.classList.add('d-none')
            offcanvasName.classList.add('d-none')
          }
        } else {
          buttons.classList.remove('d-none')
          menu.classList.add('d-none')
          offcanvasIngresar.classList.remove('d-none')
          offcanvasUserInfo.classList.add('d-none')
          avatar.innerHTML = '👤 Mi cuenta'
          nameLabel.classList.add('d-none')
          offcanvasName.classList.add('d-none')
        }
      }

      obtenerSesion().then(({ data: { session } }) => {
        actualizarSesionHeader(session)
      })

      escucharAuth((event, session) => {
        actualizarSesionHeader(session)
      })
    })

    ;(async () => {
      const sesion = await obtenerSesion()
      if (!sesion.data.session) {
        window.location.href = 'login.html'
        return
      }
      cargarMisAvisos()
    })()
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const btn = document.querySelector('.mobile-menu-toggle')

      panel.addEventListener('shown.bs.offcanvas', () => btn.classList.add('abierto'))
      panel.addEventListener('hidden.bs.offcanvas', () => btn.classList.remove('abierto'))
    })
  </script>

          <span id="offcanvas-mis-email" style="font-size:0.85rem;color:#6B7280;"></span>
          <span id="offcanvas-mis-name" class="d-none" style="font-size:0.8rem;color:#9CA3AF;"></span>
        </div>
        <button onclick="cerrarSesion()" class="btn-secundario w-100" style="color:#EF4444;border-color:#EF4444;">

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
